<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUMO — خصومات الخميس</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Noto Sans Arabic", sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #fff;
    }

    .header-logo {
      width: 105px;
      height: 52px;
      object-fit: contain;
      object-position: center;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .logout-btn {
      border: 1px solid #111;
      background: #fff;
      color: #111;
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #111;
      color: #fff;
    }


    /* =========================
       LOGIN
    ========================= */

    .login-page {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .login-logo {
      width: 190px;
      max-width: 80%;
      height: auto;
      margin-bottom: 18px;
    }

    .login-title {
      font-size: 25px;
      font-weight: 700;
      margin: 0 0 7px;
    }

    .login-subtitle {
      font-size: 13px;
      color: #777;
      margin: 0 0 25px;
    }

    .google-btn {
      width: 100%;
      height: 48px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .google-btn:hover {
      background: #333;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #999;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e5e5;
    }

    .auth-form {
      text-align: right;
    }

    .input-label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .auth-input {
      width: 100%;
      height: 47px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 13px;
      outline: none;
      background: #fff;
      font-size: 14px;
      direction: ltr;
      text-align: left;
      margin-bottom: 14px;
    }

    .auth-input:focus {
      border-color: #111;
    }

    .primary-btn {
      width: 100%;
      height: 47px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .primary-btn:hover {
      background: #333;
    }

    .secondary-btn {
      width: 100%;
      height: 45px;
      background: #fff;
      color: #111;
      border: 1px solid #111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }

    .forgot-btn {
      border: none;
      background: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 7px 0;
      margin-top: 3px;
    }

    .forgot-btn:hover {
      color: #111;
    }

    .auth-message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.7;
      min-height: 20px;
    }

    .auth-message.success {
      color: #188038;
    }

    .auth-message.error {
      color: #c62828;
    }


    /* =========================
       WHEEL PAGE
    ========================= */

    .wheel-page {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      padding: 35px 18px 60px;
    }

    .wheel-container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .wheel-title {
      font-size: 31px;
      line-height: 1.5;
      font-weight: 800;
      margin: 0;
    }

    .wheel-subtitle {
      color: #777;
      font-size: 13px;
      margin: 4px 0 28px;
    }


    /* =========================
       PROFESSIONAL WHEEL
    ========================= */

    .wheel-wrap {
      position: relative;
      width: min(90vw, 500px);
      aspect-ratio: 1;
      margin: 0 auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .wheel-wrap.disabled {
      cursor: not-allowed;
    }

    .wheel-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #wheelGraphic {
      transform-origin: 250px 250px;
      transition:
        transform 5.6s cubic-bezier(.12,.72,.12,1);
    }

    .wheel-sector {
      stroke: #111;
      stroke-width: 2;
    }

    .wheel-outline {
      fill: none;
      stroke: #111;
      stroke-width: 7;
    }

    .wheel-text {
      font-family: "Noto Sans Arabic", sans-serif;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .wheel-text.percent {
      font-size: 25px;
    }

    .wheel-text.luck {
      font-size: 19px;
    }

    .wheel-center {
      position: absolute;
      width: 108px;
      height: 108px;

      border-radius: 50%;
      background: #fff;

      border: 5px solid #111;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      pointer-events: none;
    }

    .wheel-center img {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .pointer {
      position: absolute;

      z-index: 30;

      top: -4px;
      left: 50%;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 30px solid #111;

      filter:
        drop-shadow(
          0 2px 1px rgba(0,0,0,.15)
        );

      pointer-events: none;
    }


    /* =========================
       COUNTDOWN
    ========================= */

    .countdown-box {
      margin: 23px auto 0;
      text-align: center;
    }

    .countdown-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .countdown {
      direction: ltr;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 180px;

      padding: 9px 17px;

      border: 1px solid #dedede;
      border-radius: 6px;

      background: #fff;

      color: #111;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 27px;
      font-weight: 700;

      letter-spacing: 2px;

      line-height: 1;
    }

    .countdown.available {
      direction: rtl;

      font-family:
        "Noto Sans Arabic",
        sans-serif;

      font-size: 14px;
      letter-spacing: 0;
      font-weight: 700;

      border-color: #111;
    }


    /* =========================
       SPIN BUTTON
    ========================= */

    .spin-btn {
      margin-top: 27px;

      width: 210px;
      height: 52px;

      border-radius: 7px;
      border: none;

      background: #111;
      color: #fff;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .spin-btn:hover {
      background: #333;
    }

    .spin-btn:active {
      transform: scale(.98);
    }

    .spin-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }


    /* =========================
       RESULT
    ========================= */

    .result-box {
      margin: 25px auto 0;

      width: min(100%, 420px);

      border: 1px solid #ddd;

      padding: 20px;

      border-radius: 8px;

      background: #fff;
    }

    .result-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .result-prize {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .coupon {
      display: inline-block;

      background: #111;
      color: #fff;

      padding: 9px 14px;

      border-radius: 5px;

      font-family: monospace;

      font-size: 15px;

      letter-spacing: 1px;

      direction: ltr;
    }

    .next-date {
      font-size: 12px;
      color: #777;
      margin-top: 13px;
    }


    /* =========================
       ADMIN
    ========================= */

    .admin-panel {
      margin: 50px auto 0;

      width: min(100%, 950px);

      text-align: right;
    }

    .admin-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .table-wrap {
      overflow-x: auto;

      border: 1px solid #ddd;

      border-radius: 7px;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 750px;

      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid #eee;

      padding: 11px 10px;

      font-size: 12px;

      text-align: right;

      white-space: nowrap;
    }

    th {
      background: #111;
      color: #fff;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .loading {
      color: #777;
      font-size: 13px;
      padding: 15px 0;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 68px;
        padding: 0 14px;
      }

      .header-logo {
        width: 90px;
      }

      .header-user {
        font-size: 11px;
      }

      .logout-btn {
        padding: 6px 9px;
        font-size: 11px;
      }

      .login-page {
        min-height: calc(100vh - 68px);
      }

      .wheel-page {
        min-height: calc(100vh - 68px);
        padding-top: 25px;
      }

      .wheel-title {
        font-size: 26px;
      }

      .wheel-center {
        width: 86px;
        height: 86px;
        border-width: 4px;
      }

      .wheel-center img {
        width: 66px;
        height: 66px;
      }

      .pointer {
        border-left-width: 13px;
        border-right-width: 13px;
        border-top-width: 24px;
      }

      .wheel-text.percent {
        font-size: 23px;
      }

      .wheel-text.luck {
        font-size: 17px;
      }

      .spin-btn {
        width: 190px;
      }

      .countdown {
        min-width: 165px;
        font-size: 25px;
      }
    }

  </style>
</head>

  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://vknhrxxkmhrnfbmsllid.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QliqBYSeykn4F2Ddrsn8hg_F_N8dR-n";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginPage =
      document.getElementById("loginPage");

    const wheelPage =
      document.getElementById("wheelPage");

    const mainHeader =
      document.getElementById("mainHeader");

    const userEmail =

    const countdown =

    const countdownLabel =
      document.getElementById("countdownLabel");

    const adminPanel =

    const adminLoading =
      document.getElementById("adminLoading");

    const participantsBody =
      document.getElementById("participantsBody");


    /* =========================================
       ADMIN
    ========================================= */

    const ADMIN_UID =
      "2d2313ef-8ae1-40a0-9a56-89abe56d3c37";


    /* =========================================
       WHEEL
    ========================================= */

    const WHEEL_CENTER = 250;

    const WHEEL_RADIUS = 246;

    const SECTOR_COUNT = 7;

    const SECTOR_ANGLE =
      360 / SECTOR_COUNT;

    let currentRotation = 0;

    let spinning = false;

    let nextEligibleAt = null;

    let countdownTimer = null;


    /* =========================================
       PRIZES
    ========================================= */

    const prizes = [
      {
        label: "5%",
        color: "#111",
        textColor: "#fff"
      },
      {
        label: "حظ أوفر",
        color: "#fff",
        textColor: "#111"
      },
      {
        label: "10%",
        color: "#111",
        textColor: "#fff"
      },
      {
        label: "15%",
        color: "#fff",
        textColor: "#111"
      },
      {
        label: "20%",
        color: "#111",
        textColor: "#fff"
      },
      {
        label: "25%",
        color: "#fff",
        textColor: "#111"
      },
      {
        label: "30%",
        color: "#111",
        textColor: "#fff"
      }
    ];


    /* =========================================
       CREATE PERFECT WHEEL
    ========================================= */

    function polarToCartesian(
      cx,
      cy,
      radius,
      angle
    ) {

      const radians =
        (angle - 90) *
        Math.PI / 180;

      return {

        x:
          cx +
          radius *
          Math.cos(radians),

        y:
          cy +
          radius *
          Math.sin(radians)

      };

    }


    function createSectorPath(
      startAngle,
      endAngle
    ) {

      const start =
        polarToCartesian(
          WHEEL_CENTER,
          WHEEL_CENTER,
          WHEEL_RADIUS,
          endAngle
        );

      const end =
        polarToCartesian(
          WHEEL_CENTER,
          WHEEL_CENTER,
          WHEEL_RADIUS,
          startAngle
        );


      return `
        M ${WHEEL_CENTER} ${WHEEL_CENTER}
        L ${start.x} ${start.y}
        A ${WHEEL_RADIUS}
          ${WHEEL_RADIUS}
          0 0 0
          ${end.x}
          ${end.y}
        Z
      `;

    }


    function createWheel() {

      wheelGraphic.innerHTML = "";


      prizes.forEach(
        (prize, index) => {

          const startAngle =
            index *
            SECTOR_ANGLE -
            SECTOR_ANGLE / 2;


          const endAngle =
            startAngle +
            SECTOR_ANGLE;


          /* القطاع */

          const path =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );


          path.setAttribute(
            "d",
            createSectorPath(
              startAngle,
              endAngle
            )
          );


          path.setAttribute(
            "fill",
            prize.color
          );


          path.setAttribute(
            "class",
            "wheel-sector"
          );


          wheelGraphic.appendChild(
            path
          );


          /* النص */

          const text =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text"
            );


          const labelRadius =
            index === 1
              ? 165
              : 157;


          const point =
            polarToCartesian(
              WHEEL_CENTER,
              WHEEL_CENTER,
              labelRadius,
              index * SECTOR_ANGLE
            );


          text.setAttribute(
            "x",
            point.x
          );


          text.setAttribute(
            "y",
            point.y
          );


          text.setAttribute(
            "fill",
            prize.textColor
          );


          text.setAttribute(
            "class",
            index === 1
              ? "wheel-text luck"
              : "wheel-text percent"
          );


          text.textContent =
            prize.label;


          wheelGraphic.appendChild(
            text
          );

        }
      );


      /* الإطار الخارجي */

      const outline =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );


      outline.setAttribute(
        "cx",
        WHEEL_CENTER
      );


      outline.setAttribute(
        "cy",
        WHEEL_CENTER
      );


      outline.setAttribute(
        "r",
        WHEEL_RADIUS
      );


      outline.setAttribute(
        "class",
        "wheel-outline"
      );


      wheelGraphic.appendChild(
        outline
      );

    }


    createWheel();


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
      message,
      type = ""
    ) {

      authMessage.textContent =
        message;

      authMessage.className =
        "auth-message " + type;

    }


    /* =========================================
       GOOGLE
    ========================================= */

    googleBtn.addEventListener(
      "click",
      async () => {

        showMessage("");


        const { error } =
          await db.auth.signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                window.location.origin +
                window.location.pathname,

              queryParams: {
                prompt:
                  "select_account"
              }

            }

          });


        if (error) {

          console.error(error);

          showMessage(
            "حدث خطأ أثناء تسجيل الدخول بواسطة Google.",
            "error"
          );

        }

      }
    );


    /* =========================================
       EMAIL LOGIN
    ========================================= */

    emailForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          !email ||
          !password
        ) {

          showMessage(
            "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
            "error"
          );

          return;

        }


        showMessage(
          "جاري تسجيل الدخول..."
        );


        const {
          data,
          error
        } =
          await db.auth.signInWithPassword({

            email,
            password

          });


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(
              error.message
            ),
            "error"
          );

          return;

        }


        if (data.session) {

          showMessage(
            "تم تسجيل الدخول بنجاح.",
            "success"
          );

        }

      }
    );


    /* =========================================
       SIGN UP
    ========================================= */

    signupBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          !email ||
          !password
        ) {

          showMessage(
            "أدخل البريد الإلكتروني وكلمة المرور أولاً.",
            "error"
          );

          return;

        }


        if (
          password.length < 6
        ) {

          showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
            "error"
          );

          return;

        }


        showMessage(
          "جاري إنشاء الحساب..."
        );


        const {
          data,
          error
        } =
          await db.auth.signUp({

            email,
            password,

            options: {

              emailRedirectTo:
                window.location.origin +
                window.location.pathname

            }

          });


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(
              error.message
            ),
            "error"
          );

          return;

        }


        if (data.session) {

          showMessage(
            "تم إنشاء الحساب وتسجيل الدخول.",
            "success"
          );

        } else {

          showMessage(
            "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب.",
            "success"
          );

        }

      }
    );


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    forgotBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "اكتب بريدك الإلكتروني أولاً.",
            "error"
          );

          emailInput.focus();

          return;

        }


        showMessage(
          "جاري إرسال رابط استعادة كلمة المرور..."
        );


        const { error } =
          await db.auth.resetPasswordForEmail(
            email,
            {

              redirectTo:
                window.location.origin +
                window.location.pathname

            }
          );


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(
              error.message
            ),
            "error"
          );

          return;

        }


        showMessage(
          "تم إرسال رابط استعادة كلمة المرور إلى بريدك.",
          "success"
        );

      }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await db.auth.signOut();

      }
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    db.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          session &&
          session.user
        ) {

          await showLoggedIn(
            session.user
          );

        } else {

          showLoggedOut();

        }

      }
    );


    /* =========================================
       SHOW LOGGED IN
    ========================================= */

    async function showLoggedIn(
      user
    ) {

      loginPage.classList.add(
        "hidden"
      );

      wheelPage.classList.remove(
        "hidden"
      );

      mainHeader.classList.remove(
        "hidden"
      );

      userEmail.textContent =
        user.email || "";


      resultBox.classList.add(
        "hidden"
      );


      /* جلب آخر مشاركة */

      await loadLatestSpin();


      if (
        user.id === ADMIN_UID
      ) {

        adminPanel.classList.remove(
          "hidden"
        );

        loadParticipants();

      } else {

        adminPanel.classList.add(
          "hidden"
        );

      }

    }


    /* =========================================
       SHOW LOGGED OUT
    ========================================= */

    function showLoggedOut() {

      loginPage.classList.remove(
        "hidden"
      );

      wheelPage.classList.add(
        "hidden"
      );

      mainHeader.classList.add(
        "hidden"
      );

      adminPanel.classList.add(
        "hidden"
      );

      userEmail.textContent =
        "";

      emailInput.value =
        "";

      passwordInput.value =
        "";

      stopCountdown();

      showMessage("");

    }


    /* =========================================
       LOAD LATEST SPIN
    ========================================= */

    async function loadLatestSpin() {

      const {
        data,
        error
      } =
        await db
          .from("spins")
          .select(
            "spun_at, prize, coupon_code, next_eligible_at"
          )
          .order(
            "spun_at",
            {
              ascending: false
            }
          )
          .limit(1);


      if (error) {

        console.error(error);

        setAvailable();

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        setAvailable();

        return;

      }


      const latest =
        data[0];


      nextEligibleAt =
        latest.next_eligible_at;


      const remaining =
        new Date(
          nextEligibleAt
        ).getTime() -
        Date.now();


      if (
        remaining <= 0
      ) {

        setAvailable();

      } else {

        setCooldown(
          nextEligibleAt
        );

      }

    }


    /* =========================================
       COUNTDOWN
    ========================================= */

    function setAvailable() {

      nextEligibleAt =
        null;


      stopCountdown();


      countdown.classList.add(
        "available"
      );


      countdown.textContent =
        "متاح الآن";


      countdownLabel.textContent =
        "يمكنك تجربة العجلة الآن";


      spinBtn.disabled =
        false;


      wheelWrap.classList.remove(
        "disabled"
      );

    }


    function setCooldown(
      targetDate
    ) {

      nextEligibleAt =
        targetDate;


      countdown.classList.remove(
        "available"
      );


      spinBtn.disabled =
        true;


      wheelWrap.classList.add(
        "disabled"
      );


      updateCountdown();


      stopCountdown();


      countdownTimer =
        setInterval(
          updateCountdown,
          1000
        );

    }


    function updateCountdown() {

      if (!nextEligibleAt)
        return;


      const difference =
        new Date(
          nextEligibleAt
        ).getTime() -
        Date.now();


      if (
        difference <= 0
      ) {

        setAvailable();

        return;

      }


      const totalSeconds =
        Math.floor(
          difference / 1000
        );


      const days =
        Math.floor(
          totalSeconds / 86400
        );


      const hours =
        Math.floor(
          (totalSeconds % 86400) /
          3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) /
          60
        );


      const seconds =
        totalSeconds % 60;


      if (
        days > 0
      ) {

        countdown.textContent =
          `${days} يوم  ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

      } else {

        countdown.textContent =
          `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

      }


      countdownLabel.textContent =
        "الوقت المتبقي لإعادة التجربة";

    }


    function pad(
      number
    ) {

      return String(
        number
      ).padStart(
        2,
        "0"
      );

    }


    function stopCountdown() {

      if (
        countdownTimer
      ) {

        clearInterval(
          countdownTimer
        );

        countdownTimer =
          null;

      }

    }


    /* =========================================
       WHEEL CLICK
    ========================================= */

    wheelWrap.addEventListener(
      "click",
      () => {

        spinWheel();

      }
    );


    /* =========================================
       BUTTON CLICK
    ========================================= */

    spinBtn.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        spinWheel();

      }
    );


    /* =========================================
       SPIN WHEEL
    ========================================= */

    async function spinWheel() {

      if (spinning)
        return;


      if (nextEligibleAt) {

        const remaining =
          new Date(
            nextEligibleAt
          ).getTime() -
          Date.now();


        if (
          remaining > 0
        ) {

          updateCountdown();

          return;

        }

      }


      spinning =
        true;


      spinBtn.disabled =
        true;


      wheelWrap.classList.add(
        "disabled"
      );


      resultBox.classList.add(
        "hidden"
      );


      const {
        data,
        error
      } =
        await db.rpc(
          "spin_wheel"
        );


      if (error) {

        console.error(error);


        spinning =
          false;


        spinBtn.disabled =
          false;


        wheelWrap.classList.remove(
          "disabled"
        );


        alert(
          translateSpinError(
            error.message
          )
        );


        return;

      }


      const result =
        Array.isArray(data)
          ? data[0]
          : data;


      const sectorIndex =
        getSectorIndex(
          result.prize
        );


      /*
        كل قطاع 51.428571°
        ومركز القطاع الأول بالأعلى.
      */

      const targetRotation =
        -(
          sectorIndex *
          SECTOR_ANGLE
        );


      const normalizedCurrent =
        normalizeAngle(
          currentRotation
        );


      const normalizedTarget =
        normalizeAngle(
          targetRotation
        );


      let difference =
        normalizedTarget -
        normalizedCurrent;


      if (
        difference < 0
      ) {

        difference +=
          360;

      }


      /*
        7 لفات كاملة قبل النتيجة
      */

      const extraSpins =
        360 * 7;


      currentRotation +=
        extraSpins +
        difference;


      wheelGraphic.style.transform =
        `rotate(${currentRotation}deg)`;


      setTimeout(
        () => {

          resultPrize.textContent =
            result.prize;


          couponCode.textContent =
            result.coupon_code;


          nextDate.textContent =
            "يمكنك المشاركة مرة أخرى بعد: " +
            formatDate(
              result.next_eligible_at
            );


          resultBox.classList.remove(
            "hidden"
          );


          nextEligibleAt =
            result.next_eligible_at;


          setCooldown(
            result.next_eligible_at
          );


          spinning =
            false;


          if (
            !adminPanel.classList.contains(
              "hidden"
            )
          ) {

            loadParticipants();

          }

        },
        5700
      );

    }


    /* =========================================
       PRIZE → SECTOR
    ========================================= */

    function getSectorIndex(
      prize
    ) {

      if (!prize)
        return 0;


      const value =
        String(
          prize
        ).trim();


      if (
        value.includes("5%")
      )
        return 0;


      if (
        value.includes("حظ") ||
        value.includes("أوفر")
      )
        return 1;


      if (
        value.includes("10%")
      )
        return 2;


      if (
        value.includes("15%")
      )
        return 3;


      if (
        value.includes("20%")
      )
        return 4;


      if (
        value.includes("25%")
      )
        return 5;


      if (
        value.includes("30%")
      )
        return 6;


      return 0;

    }


    function normalizeAngle(
      angle
    ) {

      return (
        (
          angle % 360
        ) +
        360
      ) % 360;

    }


    /* =========================================
       DATE
    ========================================= */

    function formatDate(
      dateString
    ) {

      if (!dateString)
        return "-";


      const date =
        new Date(
          dateString
        );


      return date.toLocaleString(
        "ar-IQ",
        {

          year:
            "numeric",

          month:
            "long",

          day:
            "numeric",

          hour:
            "numeric",

          minute:
            "2-digit"

        }
      );

    }


    /* =========================================
       ADMIN
    ========================================= */

    async function loadParticipants() {

      adminLoading.classList.remove(
        "hidden"
      );


      participantsBody.innerHTML =
        "";


      const {
        data,
        error
      } =
        await db.rpc(
          "get_participants"
        );


      adminLoading.classList.add(
        "hidden"
      );


      if (error) {

        console.error(error);

        participantsBody.innerHTML = `
          <tr>
            <td colspan="7">
              تعذر تحميل المشاركين.
            </td>
          </tr>
        `;

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        participantsBody.innerHTML = `
          <tr>
            <td colspan="7">
              لا يوجد مشاركون حتى الآن.
            </td>
          </tr>
        `;

        return;

      }


      data.forEach(
        participant => {

          const row =
            document.createElement(
              "tr"
            );


          row.innerHTML = `

            <td>
              ${escapeHtml(
                participant.full_name || "-"
              )}
            </td>

            <td dir="ltr">
              ${escapeHtml(
                participant.email || "-"
              )}
            </td>

            <td dir="ltr">
              ${escapeHtml(
                participant.phone || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                participant.prize || "-"
              )}
            </td>

            <td dir="ltr">
              ${escapeHtml(
                participant.coupon_code || "-"
              )}
            </td>

            <td>
              ${
                participant.last_spin_at
                  ? formatDate(
                      participant.last_spin_at
                    )
                  : "-"
              }
            </td>

            <td>
              ${
                participant.next_eligible_at
                  ? formatDate(
                      participant.next_eligible_at
                    )
                  : "-"
              }
            </td>

          `;


          participantsBody.appendChild(
            row
          );

        }
      );

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================
       AUTH ERRORS
    ========================================= */

    function translateAuthError(
      message
    ) {

      const text =
        String(
          message || ""
        ).toLowerCase();


      if (
        text.includes(
          "invalid login credentials"
        )
      ) {

        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }


      if (
        text.includes(
          "email not confirmed"
        )
      ) {

        return "يرجى تأكيد بريدك الإلكتروني أولاً.";

      }


      if (
        text.includes(
          "user already registered"
        )
      ) {

        return "هذا البريد مسجل مسبقاً. حاول تسجيل الدخول.";

      }


      if (
        text.includes("password") &&
        text.includes("6")
      ) {

        return "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

      }


      if (
        text.includes(
          "rate limit"
        )
      ) {

        return "تم إرسال عدد كبير من الطلبات. حاول لاحقاً.";

      }


      return "حدث خطأ. يرجى التأكد من البيانات والمحاولة مرة أخرى.";

    }


    /* =========================================
       SPIN ERRORS
    ========================================= */

    function translateSpinError(
      message
    ) {

      const text =
        String(
          message || ""
        );


      if (
        text.includes(
          "14 يوماً"
        )
      ) {

        return text;

      }


      if (
        text.includes(
          "تسجيل الدخول"
        )
      ) {

        return text;

      }


      return "تعذر تنفيذ المشاركة. حاول مرة أخرى.";

    }

  </script>
