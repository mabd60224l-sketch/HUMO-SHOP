/* ================= HEADER ================= */

/* ================= WHEEL SECTION ================= */

.wheel-section {

  min-height: calc(100vh - 76px);

  background: #111;

  display: flex;

  flex-direction: column;

  align-items: center;

/* هوية HUMO العربية */

.wheel-title {

  font-size: 30px;

  font-weight: 700;

  letter-spacing: 0;

  line-height: 1.5;

  color: #fff;

  margin-bottom: 7px;
}

.wheel-subtitle {

  color: #aaa;

  font-size: 13px;

  margin-bottom: 35px;
}


/* ================= WHEEL ================= */

.wheel-wrap {

  position: relative;

  width: min(380px, 90vw);

  aspect-ratio: 1 / 1;

  margin: 0 auto;
}

.wheel {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  border-radius: 50%;

  border: 5px solid #fff;

  overflow: hidden;

  background:
    conic-gradient(

      #111 0deg 51.428571deg,

      #fff 51.428571deg 102.857142deg,

      #111 102.857142deg 154.285714deg,

      #fff 154.285714deg 205.714285deg,

      #111 205.714285deg 257.142857deg,

      #fff 257.142857deg 308.571428deg,

      #111 308.571428deg 360deg
    );

  transform: rotate(0deg);

  transition:
    transform 5.3s cubic-bezier(.12,.72,.12,1);

  z-index: 1;
}


/* ================= LINES ================= */

.wheel-lines {

  position: absolute;

  inset: 0;

  border-radius: 50%;

  pointer-events: none;

  background:
    conic-gradient(

      transparent 0deg 51deg,
      rgba(0,0,0,.55) 51deg 51.7deg,

      transparent 51.7deg 102.4deg,
      rgba(0,0,0,.55) 102.4deg 103.1deg,

      transparent 103.1deg 153.8deg,
      rgba(0,0,0,.55) 153.8deg 154.5deg,

      transparent 154.5deg 205.2deg,
      rgba(0,0,0,.55) 205.2deg 205.9deg,

      transparent 205.9deg 256.6deg,
      rgba(0,0,0,.55) 256.6deg 257.3deg,

      transparent 257.3deg 308deg,
      rgba(0,0,0,.55) 308deg 308.7deg,

      transparent 308.7deg 359.4deg,
      rgba(0,0,0,.55) 359.4deg 360deg
    );
}


/* ================= LABELS ================= */

.wheel-labels {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  border-radius: 50%;

  z-index: 5;

  transform: rotate(0deg);

  transition:
    transform 5.3s cubic-bezier(.12,.72,.12,1);
}

.wheel-label {

  position: absolute;

  width: 100px;
  height: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  font-size: 17px;

  font-weight: 800;

  transform: translate(-50%, -50%);
}

.wheel-label span {

  display: block;

  white-space: nowrap;

  transform:
    rotate(calc(-1 * var(--current-rotation)));

  transform-origin: center;
}

.pointer {

  height: 0;

/* ================= BUTTON ================= */

/* ================= ADMIN ================= */

/* ================= TOAST ================= */

.toast {

<script>


/* ================= SUPABASE ================= */

const SUPABASE_URL =
  "https://vknhrxxkmhrnfbmsllid.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QliqBYSeykn4F2Ddrsn8hg_F_N8dR-n";

const { createClient } = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================= ADMIN ================= */

const ADMIN_UID =
  "2d2313ef-8ae1-40a0-9a56-89abe56d3c37";


/* ================= ELEMENTS ================= */

const loginScreen =
  document.getElementById("loginScreen");

const store =
  document.getElementById("store");

const googleBtn =
  document.getElementById("googleBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const userName =
  document.getElementById("userName");

const spinBtn =
  document.getElementById("spinBtn");

const wheel =
  document.getElementById("wheel");

const wheelLabels =
  document.getElementById("wheelLabels");

const wheelStatus =
  document.getElementById("wheelStatus");

const resultBox =
  document.getElementById("resultBox");

const resultPrize =
  document.getElementById("resultPrize");

const couponCode =
  document.getElementById("couponCode");

const nextDate =
  document.getElementById("nextDate");

const adminPanel =
  document.getElementById("adminPanel");

const participantsBody =
  document.getElementById("participantsBody");

const toast =
  document.getElementById("toast");


let currentRotation = 0;


/* ================= TOAST ================= */

function showToast(message) {

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 3500);
}


/* ================= GOOGLE ================= */

googleBtn.addEventListener(
  "click",
  async () => {

    googleBtn.disabled = true;

    googleBtn.innerHTML =
      "جاري فتح Google...";

    try {

      const redirectUrl =
        window.location.origin +
        window.location.pathname;

      const { error } =
        await db.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              redirectUrl,

            queryParams: {

              prompt:
                "select_account"

            }

          }

        });

      if (error) {

        throw error;

      }

    } catch (error) {

      console.error(error);

      showToast(
        "حدث خطأ أثناء تسجيل الدخول باستخدام Google"
      );

      googleBtn.disabled =
        false;

      googleBtn.innerHTML =
        '<span class="google-icon">G</span> متابعة باستخدام Google';

    }

  }
);


/* ================= LOGOUT ================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    await db.auth.signOut();

    location.reload();

  }
);


/* ================= DATE ================= */

function formatDate(dateString) {

  if (!dateString) {
    return "-";
  }

  return new Date(
    dateString
  ).toLocaleString(
    "ar-IQ",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );
}


/* ================= REMAINING ================= */

function formatRemaining(date) {

  const difference =
    date.getTime() -
    Date.now();

  if (difference <= 0) {
    return "الآن";
  }

  const days =
    Math.floor(
      difference /
      86400000
    );

  const hours =
    Math.floor(
      (
        difference %
        86400000
      ) /
      3600000
    );

  if (days > 0) {

    return (
      days +
      " يوم" +
      (
        hours
          ? " و " +
            hours +
            " ساعة"
          : ""
      )
    );

  }

  return hours + " ساعة";
}


/* ================= SHOW USER ================= */

async function showUser(session) {

  if (
    !session ||
    !session.user
  ) {

    loginScreen.style.display =
      "flex";

    store.style.display =
      "none";

    return;
  }

  loginScreen.style.display =
    "none";

  store.style.display =

  logoutBtn.style.display =
    "block";

  const user =
    session.user;

  const name =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "زائر HUMO";

  userName.textContent =
    name;

  await loadLastSpin();

  if (
    user.id === ADMIN_UID
  ) {

    adminPanel.style.display =
      "block";

    await loadParticipants();

  }
}


/* ================= LAST SPIN ================= */

async function loadLastSpin() {

  try {

    const {
      data,
      error
    } = await db
      .from("spins")
      .select("*")
      .order(
        "spun_at",
        {
          ascending: false
        }
      )
      .limit(1);

    if (error) {

      console.error(error);

      return;

    }

    if (
      !data ||
      !data.length
    ) {

      spinBtn.disabled =
        false;

      wheelStatus.textContent =
        "لديك فرصة للمشاركة.";

      return;

    }

    const last =
      data[0];

    const next =
      new Date(
        last.next_eligible_at
      );

    if (
      next > new Date()
    ) {

      spinBtn.disabled =
        true;

      wheelStatus.textContent =
        "يمكنك المشاركة مرة أخرى بعد " +
        formatRemaining(next);

    } else {

      spinBtn.disabled =
        false;

      wheelStatus.textContent =
        "فرصتك متاحة الآن.";

    }

  } catch (error) {

    console.error(error);

  }
}


/* ================= SPIN ================= */

spinBtn.addEventListener(
  "click",
  spinWheel
);


async function spinWheel() {

  if (
    spinBtn.disabled
  ) {

    return;

  }

  spinBtn.disabled =
    true;

  wheelStatus.textContent =
    "جاري اختيار جائزتك...";

  resultBox.style.display =
    "none";

  try {

    const {
      data: {
        session
      }
    } =
      await db.auth.getSession();

    if (!session) {

      showToast(
        "يجب تسجيل الدخول أولاً."
      );

      spinBtn.disabled =
        false;

      return;

    }

    const {
      data,
      error
    } =
      await db.rpc(
        "spin_wheel"
      );

    if (error) {

      throw error;

    }

    const spin =
      Array.isArray(data)
        ? data[0]
        : data;

    if (!spin) {

      throw new Error(
        "لم يتم استلام نتيجة."
      );

    }

    const prize =
      spin.prize || "";

    const discount =
      Number(
        spin.discount_percent || 0
      );

    const coupon =
      spin.coupon_code || "";


    let targetIndex =
      0;


    if (
      discount === 0 ||
      prize.includes("حظ")
    ) {

      targetIndex =
        1;

    } else {

      const map = {

        5: 0,
        10: 2,
        15: 3,
        20: 4,
        25: 5,
        30: 6

      };

      targetIndex =
        map[discount] ?? 0;

    }


    const segment =
      360 / 7;

    const targetCenter =
      targetIndex *
      segment +
      segment / 2;

    const extraTurns =
      7 * 360;

    const finalRotation =
      currentRotation +
      extraTurns +
      (
        360 -
        targetCenter -
        (
          currentRotation %
          360
        )
      );

    currentRotation =
      finalRotation;


    wheelLabels.style.setProperty(
      "--current-rotation",
      currentRotation + "deg"
    );


    wheel.style.transform =
      "rotate(" +
      currentRotation +
      "deg)";


    wheelLabels.style.transform =
      "rotate(" +
      currentRotation +
      "deg)";


    setTimeout(() => {

      resultPrize.textContent =
        prize;

      couponCode.textContent =
        coupon;

      nextDate.textContent =
        "يمكنك المشاركة مرة أخرى في: " +
        formatDate(
          spin.next_eligible_at
        );

      resultBox.style.display =
        "block";

      wheelStatus.textContent =
        "مبروك 🎉";

    }, 5500);


  } catch (error) {

    console.error(error);

    spinBtn.disabled =
      false;

    let message =
      error?.message ||
      "حدث خطأ.";

    if (
      message.includes("14")
    ) {

      message =
        "لقد شاركت مسبقًا. يمكنك المشاركة مرة أخرى بعد 14 يومًا.";

    }

    showToast(message);

    wheelStatus.textContent =
      "";

  }

}


/* ================= ADMIN ================= */

async function loadParticipants() {

  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "get_participants"
      );

    if (error) {

      throw error;

    }

    participantsBody.innerHTML =
      "";

    if (
      !data ||
      !data.length
    ) {

      participantsBody.innerHTML =
        "<tr><td colspan='7'>لا توجد مشاركات بعد.</td></tr>";

      return;

    }

    data.forEach(
      user => {

        const row =
          document.createElement(
            "tr"
          );

        row.innerHTML = `

          <td>
            ${escapeHtml(
              user.full_name || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.phone || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.email || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.prize || "-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHtml(
              user.coupon_code || "-"
            )}
          </td>

          <td>
            ${formatDate(
              user.last_spin_at
            )}
          </td>

          <td>
            ${formatDate(
              user.next_eligible_at
            )}
          </td>

        `;

        participantsBody.appendChild(
          row
        );

      }
    );

  } catch (error) {

    console.error(error);

    participantsBody.innerHTML =
      "<tr><td colspan='7'>تعذر تحميل المشاركين.</td></tr>";

  }
}


/* ================= ESCAPE ================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* ================= AUTH ================= */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event === "SIGNED_IN" ||
      event === "INITIAL_SESSION"
    ) {

      await showUser(
        session
      );

    }

    if (
      event === "SIGNED_OUT"
    ) {

      loginScreen.style.display =
        "flex";

      store.style.display =
        "none";

    }

  }
);


/* ================= START ================= */

async function start() {

  const {
    data: {
      session
    }
  } =
    await db.auth.getSession();

  await showUser(
    session
  );

}

start();
