<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUMO — خصومات الخميس</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Noto Sans Arabic", sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #fff;
    }

    .header-logo {
      width: 105px;
      height: 52px;
      object-fit: contain;
      object-position: center;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .logout-btn {
      border: 1px solid #111;
      background: #fff;
      color: #111;
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #111;
      color: #fff;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-page {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .login-logo {
      width: 190px;
      max-width: 80%;
      height: auto;
      margin-bottom: 18px;
    }

    .login-title {
      font-size: 25px;
      font-weight: 700;
      margin: 0 0 7px;
    }

    .login-subtitle {
      font-size: 13px;
      color: #777;
      margin: 0 0 25px;
    }

    .google-btn {
      width: 100%;
      height: 48px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .google-btn:hover {
      background: #333;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #999;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e5e5;
    }

    .auth-form {
      text-align: right;
    }

    .input-label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .auth-input {
      width: 100%;
      height: 47px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 13px;
      outline: none;
      background: #fff;
      font-size: 14px;
      direction: ltr;
      text-align: left;
      margin-bottom: 14px;
    }

    .auth-input:focus {
      border-color: #111;
    }

    .primary-btn {
      width: 100%;
      height: 47px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .primary-btn:hover {
      background: #333;
    }

    .secondary-btn {
      width: 100%;
      height: 45px;
      background: #fff;
      color: #111;
      border: 1px solid #111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }

    .forgot-btn {
      border: none;
      background: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 7px 0;
      margin-top: 3px;
    }

    .forgot-btn:hover {
      color: #111;
    }

    .auth-message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.7;
      min-height: 20px;
    }

    .auth-message.success {
      color: #188038;
    }

    .auth-message.error {
      color: #c62828;
    }

    /* =========================
       WHEEL PAGE
    ========================= */

    .wheel-page {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      padding: 35px 18px 60px;
    }

    .wheel-container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .wheel-title {
      font-size: 31px;
      line-height: 1.5;
      font-weight: 800;
      margin: 0;
    }

    .wheel-subtitle {
      color: #777;
      font-size: 13px;
      margin: 4px 0 28px;
    }

    .wheel-wrap {
      position: relative;
      width: min(90vw, 500px);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    .wheel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 7px solid #111;
      overflow: hidden;

      background:
        conic-gradient(
          from -25.714285deg,

          #111 0deg 25.714285deg,
          #fff 25.714285deg 51.42857deg,

          #111 51.42857deg 77.142855deg,
          #fff 77.142855deg 102.85714deg,

          #111 102.85714deg 128.571425deg,
          #fff 128.571425deg 154.28571deg,

          #111 154.28571deg 180deg,
          #fff 180deg 205.714285deg,

          #111 205.714285deg 231.42857deg,
          #fff 231.42857deg 257.142855deg,

          #111 257.142855deg 282.85714deg,
          #fff 282.85714deg 308.571425deg,

          #111 308.571425deg 334.28571deg,
          #fff 334.28571deg 360deg
        );

      transform: rotate(0deg);
      transition: transform 5.5s cubic-bezier(.12,.72,.12,1);
    }

    .wheel-labels {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      transform: rotate(0deg);
      transition: transform 5.5s cubic-bezier(.12,.72,.12,1);
    }

    .wheel-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: clamp(15px, 3.7vw, 23px);
      white-space: nowrap;
      pointer-events: none;
    }

    .label-5 {
      left: 63.884%;
      top: 21.169%;
      color: #fff;
    }

    .label-luck {
      left: 81.198%;
      top: 42.879%;
      color: #111;
      font-size: clamp(12px, 3vw, 18px);
    }

    .label-10 {
      left: 75.019%;
      top: 69.951%;
      color: #fff;
    }

    .label-15 {
      left: 50%;
      top: 82%;
      color: #111;
    }

    .label-20 {
      left: 24.982%;
      top: 69.953%;
      color: #fff;
    }

    .label-25 {
      left: 18.802%;
      top: 42.881%;
      color: #111;
    }

    .label-30 {
      left: 36.114%;
      top: 21.17%;
      color: #fff;
    }

    .wheel-center {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #111;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wheel-center img {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .pointer {
      position: absolute;
      z-index: 10;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 30px solid #111;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,.15));
    }

    .spin-btn {
      margin-top: 30px;
      width: 210px;
      height: 52px;
      border-radius: 7px;
      border: none;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .spin-btn:hover {
      background: #333;
    }

    .spin-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       RESULT
    ========================= */

    .result-box {
      margin: 25px auto 0;
      width: min(100%, 420px);
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #fff;
    }

    .result-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .result-prize {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .coupon {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 9px 14px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 15px;
      letter-spacing: 1px;
      direction: ltr;
    }

    .next-date {
      font-size: 12px;
      color: #777;
      margin-top: 13px;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-panel {
      margin: 50px auto 0;
      width: min(100%, 950px);
      text-align: right;
    }

    .admin-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 11px 10px;
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #111;
      color: #fff;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .loading {
      color: #777;
      font-size: 13px;
      padding: 15px 0;
    }

    @media (max-width: 600px) {
      header {
        height: 68px;
        padding: 0 14px;
      }

      .header-logo {
        width: 90px;
      }

      .header-user {
        font-size: 11px;
      }

      .logout-btn {
        padding: 6px 9px;
        font-size: 11px;
      }

      .login-page {
        min-height: calc(100vh - 68px);
      }

      .wheel-page {
        min-height: calc(100vh - 68px);
        padding-top: 25px;
      }

      .wheel-title {
        font-size: 26px;
      }

      .wheel-center {
        width: 86px;
        height: 86px;
        border-width: 4px;
      }

      .wheel-center img {
        width: 66px;
        height: 66px;
      }

      .pointer {
        border-left-width: 13px;
        border-right-width: 13px;
        border-top-width: 24px;
      }

      .spin-btn {
        width: 190px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header id="mainHeader" class="hidden">

    <img
      class="header-logo"
      src="كيس%20ورقي%20للمتاجر%20بلون%20وردي%20نمط%20زهور.png"
      alt="HUMO"
    >

    <div class="header-user">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="logout-btn">
        تسجيل الخروج
      </button>
    </div>

  </header>


  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginPage" class="login-page">

    <div class="login-box">

      <img
        class="login-logo"
        src="كيس%20ورقي%20للمتاجر%20بلون%20وردي%20نمط%20زهور.png"
        alt="HUMO"
      >

      <h1 class="login-title">
        أهلاً بك في HUMO
      </h1>

      <p class="login-subtitle">
        اختيار يليق بك.
      </p>


      <!-- GOOGLE -->

      <button id="googleBtn" class="google-btn">
        متابعة باستخدام Google
      </button>


      <div class="divider">
        أو
      </div>


      <!-- EMAIL FORM -->

      <form id="emailForm" class="auth-form">

        <label class="input-label">
          البريد الإلكتروني
        </label>

        <input
          id="emailInput"
          class="auth-input"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >


        <label class="input-label">
          كلمة المرور
        </label>

        <input
          id="passwordInput"
          class="auth-input"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
          minlength="6"
          required
        >


        <button
          id="loginEmailBtn"
          class="primary-btn"
          type="submit"
        >
          تسجيل الدخول
        </button>

        <button
          id="signupBtn"
          class="secondary-btn"
          type="button"
        >
          إنشاء حساب جديد
        </button>

        <button
          id="forgotBtn"
          class="forgot-btn"
          type="button"
        >
          نسيت كلمة المرور؟
        </button>

      </form>


      <div
        id="authMessage"
        class="auth-message"
      ></div>

    </div>

  </section>


  <!-- =========================
       WHEEL
  ========================== -->

  <main id="wheelPage" class="wheel-page hidden">

    <div class="wheel-container">

      <h1 class="wheel-title">
        خصومات الخميس
      </h1>

      <p class="wheel-subtitle">
        فرصتك تتجدد كل 14 يومًا.
      </p>


      <div class="wheel-wrap">

        <div class="pointer"></div>

        <div
          id="wheel"
          class="wheel"
        ></div>


        <div
          id="wheelLabels"
          class="wheel-labels"
        >

          <div class="wheel-label label-5">
            5%
          </div>

          <div class="wheel-label label-luck">
            حظ أوفر
          </div>

          <div class="wheel-label label-10">
            10%
          </div>

          <div class="wheel-label label-15">
            15%
          </div>

          <div class="wheel-label label-20">
            20%
          </div>

          <div class="wheel-label label-25">
            25%
          </div>

          <div class="wheel-label label-30">
            30%
          </div>

        </div>


        <div class="wheel-center">

          <img
            src="كيس%20ورقي%20للمتاجر%20بلون%20وردي%20نمط%20زهور.png"
            alt="HUMO"
          >

        </div>

      </div>


      <button
        id="spinBtn"
        class="spin-btn"
      >
        جرّب حظك
      </button>


      <div
        id="resultBox"
        class="result-box hidden"
      >

        <div class="result-title">
          نتيجتك
        </div>

        <div
          id="resultPrize"
          class="result-prize"
        ></div>

        <div>
          كود الخصم:
          <br><br>

          <span
            id="couponCode"
            class="coupon"
          ></span>
        </div>

        <div
          id="nextDate"
          class="next-date"
        ></div>

      </div>


      <!-- ADMIN -->

      <section
        id="adminPanel"
        class="admin-panel hidden"
      >

        <div class="admin-title">
          المشاركون
        </div>

        <div
          id="adminLoading"
          class="loading"
        >
          جاري تحميل المشاركين...
        </div>

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>الاسم</th>
                <th>البريد</th>
                <th>الهاتف</th>
                <th>الجائزة</th>
                <th>الكود</th>
                <th>تاريخ المشاركة</th>
                <th>المشاركة القادمة</th>
              </tr>

            </thead>

            <tbody id="participantsBody"></tbody>

          </table>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://vknhrxxkmhrnfbmsllid.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QliqBYSeykn4F2Ddrsn8hg_F_N8dR-n";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginPage =
      document.getElementById("loginPage");

    const wheelPage =
      document.getElementById("wheelPage");

    const mainHeader =
      document.getElementById("mainHeader");

    const userEmail =
      document.getElementById("userEmail");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const emailForm =
      document.getElementById("emailForm");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const signupBtn =
      document.getElementById("signupBtn");

    const forgotBtn =
      document.getElementById("forgotBtn");

    const authMessage =
      document.getElementById("authMessage");

    const spinBtn =
      document.getElementById("spinBtn");

    const wheel =
      document.getElementById("wheel");

    const wheelLabels =
      document.getElementById("wheelLabels");

    const resultBox =
      document.getElementById("resultBox");

    const resultPrize =
      document.getElementById("resultPrize");

    const couponCode =
      document.getElementById("couponCode");

    const nextDate =
      document.getElementById("nextDate");

    const adminPanel =
      document.getElementById("adminPanel");

    const adminLoading =
      document.getElementById("adminLoading");

    const participantsBody =
      document.getElementById("participantsBody");


    /* =========================================
       ADMIN UID
    ========================================= */

    const ADMIN_UID =
      "2d2313ef-8ae1-40a0-9a56-89abe56d3c37";


    /* =========================================
       WHEEL STATE
    ========================================= */

    let currentRotation = 0;
    let spinning = false;


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(message, type = "") {

      authMessage.textContent = message;

      authMessage.className =
        "auth-message " + type;

    }


    /* =========================================
       GOOGLE LOGIN
    ========================================= */

    googleBtn.addEventListener("click", async () => {

      showMessage("");

      const { error } =
        await db.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              window.location.origin +
              window.location.pathname,

            queryParams: {
              prompt: "select_account"
            }

          }

        });


      if (error) {

        showMessage(
          "حدث خطأ أثناء تسجيل الدخول بواسطة Google.",
          "error"
        );

        console.error(error);

      }

    });


    /* =========================================
       EMAIL LOGIN
    ========================================= */

    emailForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
            "error"
          );

          return;

        }


        showMessage("جاري تسجيل الدخول...");


        const { data, error } =
          await db.auth.signInWithPassword({

            email,
            password

          });


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(error.message),
            "error"
          );

          return;

        }


        if (data.session) {

          showMessage(
            "تم تسجيل الدخول بنجاح.",
            "success"
          );

        }

      }
    );


    /* =========================================
       CREATE ACCOUNT
    ========================================= */

    signupBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "أدخل البريد الإلكتروني وكلمة المرور أولاً.",
            "error"
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
            "error"
          );

          return;

        }


        showMessage("جاري إنشاء الحساب...");


        const { data, error } =
          await db.auth.signUp({

            email,
            password,

            options: {

              emailRedirectTo:
                window.location.origin +
                window.location.pathname

            }

          });


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(error.message),
            "error"
          );

          return;

        }


        if (data.session) {

          showMessage(
            "تم إنشاء الحساب وتسجيل الدخول.",
            "success"
          );

        } else {

          showMessage(
            "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب.",
            "success"
          );

        }

      }
    );


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    forgotBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "اكتب بريدك الإلكتروني أولاً.",
            "error"
          );

          emailInput.focus();

          return;

        }


        showMessage(
          "جاري إرسال رابط استعادة كلمة المرور..."
        );


        const { error } =
          await db.auth.resetPasswordForEmail(
            email,
            {

              redirectTo:
                window.location.origin +
                window.location.pathname

            }
          );


        if (error) {

          console.error(error);

          showMessage(
            translateAuthError(error.message),
            "error"
          );

          return;

        }


        showMessage(
          "تم إرسال رابط استعادة كلمة المرور إلى بريدك.",
          "success"
        );

      }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await db.auth.signOut();

      }
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    db.auth.onAuthStateChange(
      async (event, session) => {

        if (session && session.user) {

          await showLoggedIn(session.user);

        } else {

          showLoggedOut();

        }

      }
    );


    /* =========================================
       SHOW LOGGED IN
    ========================================= */

    async function showLoggedIn(user) {

      loginPage.classList.add("hidden");

      wheelPage.classList.remove("hidden");

      mainHeader.classList.remove("hidden");

      userEmail.textContent =
        user.email || "";


      resultBox.classList.add("hidden");

      spinBtn.disabled = false;


      if (user.id === ADMIN_UID) {

        adminPanel.classList.remove("hidden");

        loadParticipants();

      } else {

        adminPanel.classList.add("hidden");

      }

    }


    /* =========================================
       SHOW LOGGED OUT
    ========================================= */

    function showLoggedOut() {

      loginPage.classList.remove("hidden");

      wheelPage.classList.add("hidden");

      mainHeader.classList.add("hidden");

      adminPanel.classList.add("hidden");

      userEmail.textContent = "";

      emailInput.value = "";

      passwordInput.value = "";

      showMessage("");

    }


    /* =========================================
       SPIN
    ========================================= */

    spinBtn.addEventListener(
      "click",
      async () => {

        if (spinning) return;


        spinning = true;

        spinBtn.disabled = true;

        resultBox.classList.add("hidden");


        const { data, error } =
          await db.rpc("spin_wheel");


        if (error) {

          console.error(error);

          spinning = false;

          spinBtn.disabled = false;


          alert(
            translateSpinError(error.message)
          );

          return;

        }


        const result =
          Array.isArray(data)
            ? data[0]
            : data;


        /*
          We do not visually represent the real
          probabilities. All wheel sectors remain equal.
        */

        const prize =
          result.prize;


        const sectorIndex =
          getSectorIndex(prize);


        const sectorAngle =
          360 / 7;


        /*
          Pointer is at the top.
          Put selected sector center under pointer.
        */

        const targetAngle =
          sectorIndex * sectorAngle +
          sectorAngle / 2;


        const desiredRotation =
          360 -
          targetAngle;


        const extraSpins =
          360 * 7;


        currentRotation +=
          extraSpins +
          normalizeAngle(
            desiredRotation -
            normalizeAngle(currentRotation)
          );


        wheel.style.transform =
          `rotate(${currentRotation}deg)`;

        wheelLabels.style.transform =
          `rotate(${currentRotation}deg)`;


        setTimeout(() => {

          resultPrize.textContent =
            result.prize;


          couponCode.textContent =
            result.coupon_code;


          nextDate.textContent =
            "يمكنك المشاركة مرة أخرى بعد: " +
            formatDate(result.next_eligible_at);


          resultBox.classList.remove(
            "hidden"
          );


          spinning = false;

          spinBtn.disabled = true;


          if (
            userEmail &&
            adminPanel.classList.contains("hidden") === false
          ) {

            loadParticipants();

          }

        }, 5700);

      }
    );


    /* =========================================
       PRIZE → SECTOR
    ========================================= */

    function getSectorIndex(prize) {

      if (!prize) return 0;


      const value =
        String(prize).trim();


      if (value.includes("5%"))
        return 0;


      if (
        value.includes("حظ") ||
        value.includes("أوفر")
      )
        return 1;


      if (value.includes("10%"))
        return 2;


      if (value.includes("15%"))
        return 3;


      if (value.includes("20%"))
        return 4;


      if (value.includes("25%"))
        return 5;


      if (value.includes("30%"))
        return 6;


      return 0;

    }


    function normalizeAngle(angle) {

      return (
        (angle % 360) + 360
      ) % 360;

    }


    /* =========================================
       DATE
    ========================================= */

    function formatDate(dateString) {

      if (!dateString) return "-";


      const date =
        new Date(dateString);


      return date.toLocaleString(
        "ar-IQ",
        {

          year: "numeric",
          month: "long",
          day: "numeric",

          hour: "numeric",
          minute: "2-digit"

        }
      );

    }


    /* =========================================
       ADMIN PARTICIPANTS
    ========================================= */

    async function loadParticipants() {

      adminLoading.classList.remove(
        "hidden"
      );


      participantsBody.innerHTML = "";


      const { data, error } =
        await db.rpc("get_participants");


      adminLoading.classList.add(
        "hidden"
      );


      if (error) {

        console.error(error);

        participantsBody.innerHTML = `
          <tr>
            <td colspan="7">
              تعذر تحميل المشاركين.
            </td>
          </tr>
        `;

        return;

      }


      if (!data || data.length === 0) {

        participantsBody.innerHTML = `
          <tr>
            <td colspan="7">
              لا يوجد مشاركون حتى الآن.
            </td>
          </tr>
        `;

        return;

      }


      data.forEach(participant => {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(
              participant.full_name || "-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHtml(
              participant.email || "-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHtml(
              participant.phone || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              participant.prize || "-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHtml(
              participant.coupon_code || "-"
            )}
          </td>

          <td>
            ${
              participant.last_spin_at
                ? formatDate(
                    participant.last_spin_at
                  )
                : "-"
            }
          </td>

          <td>
            ${
              participant.next_eligible_at
                ? formatDate(
                    participant.next_eligible_at
                  )
                : "-"
            }
          </td>

        `;


        participantsBody.appendChild(row);

      });

    }


    /* =========================================
       SECURITY
    ========================================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================
       AUTH ERROR TRANSLATION
    ========================================= */

    function translateAuthError(message) {

      const text =
        String(message || "").toLowerCase();


      if (
        text.includes("invalid login credentials")
      ) {

        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }


      if (
        text.includes("email not confirmed")
      ) {

        return "يرجى تأكيد بريدك الإلكتروني أولاً.";

      }


      if (
        text.includes("user already registered")
      ) {

        return "هذا البريد مسجل مسبقاً. حاول تسجيل الدخول.";

      }


      if (
        text.includes("password")
        &&
        text.includes("6")
      ) {

        return "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

      }


      if (
        text.includes("rate limit")
      ) {

        return "تم إرسال عدد كبير من الطلبات. حاول لاحقاً.";

      }


      return (
        "حدث خطأ. يرجى التأكد من البيانات والمحاولة مرة أخرى."
      );

    }


    /* =========================================
       SPIN ERROR
    ========================================= */

    function translateSpinError(message) {

      const text =
        String(message || "");


      if (
        text.includes("14 يوماً")
      ) {

        return text;

      }


      if (
        text.includes("تسجيل الدخول")
      ) {

        return text;

      }


      return (
        "تعذر تنفيذ المشاركة. حاول مرة أخرى."
      );

    }

  </script>
