<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUMO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #111111;
      --white: #ffffff;
      --soft: #f7f7f5;
      --line: #e7e7e4;
      --gray: #777777;
    }

    body {
      font-family: "Noto Sans Arabic", sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }


    /* ================= HEADER ================= */

    header {
      height: 78px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(12px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      width: 105px;
      height: 54px;
      object-fit: contain;
      object-position: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-size: 12px;
      color: #666;
    }

    .logout-btn {
      border: 1px solid #111;
      background: white;
      color: #111;

      padding: 9px 15px;

      font-size: 12px;
    }


    /* ================= LOGIN ================= */

    #loginScreen {
      min-height: calc(100vh - 78px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;

      background: #fafaf9;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: white;
      border: 1px solid var(--line);

      padding: 42px 30px;

      text-align: center;
    }

    .login-logo {
      width: 150px;
      height: 80px;
      object-fit: contain;

      margin: 0 auto 25px;
      display: block;
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;

      margin-bottom: 9px;
    }

    .login-subtitle {
      color: #777;
      font-size: 13px;
      line-height: 1.9;

      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;
      height: 53px;

      border: 1px solid #111;
      background: #111;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      font-size: 14px;
      font-weight: 700;

      transition: .2s;
    }

    .google-btn:hover {
      background: white;
      color: #111;
    }

    .google-icon {
      width: 20px;
      height: 20px;

      border-radius: 50%;
      background: white;
      color: #4285f4;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;
    }

    .login-note {
      color: #999;
      font-size: 11px;
      line-height: 1.8;

      margin-top: 18px;
    }


    /* ================= MAIN ================= */

    #store {
      display: none;
    }

    .wheel-section {

      min-height: calc(100vh - 78px);

      background: #111;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding:
        55px 20px
        70px;
    }

    .wheel-title {
      font-size: 30px;
      font-weight: 800;

      margin-bottom: 7px;
    }

    .wheel-subtitle {
      color: #aaa;
      font-size: 13px;

      margin-bottom: 38px;
    }


    /* ================= WHEEL ================= */

    .wheel-wrap {

      position: relative;

      width: min(370px, 88vw);
      height: min(370px, 88vw);

      margin: 0 auto;
    }


    .wheel {

      position: relative;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      border: 5px solid white;

      overflow: visible;

      background:
        conic-gradient(

          #111111 0deg 51.428deg,

          #ffffff 51.428deg 102.856deg,

          #111111 102.856deg 154.284deg,

          #ffffff 154.284deg 205.712deg,

          #111111 205.712deg 257.140deg,

          #ffffff 257.140deg 308.568deg,

          #111111 308.568deg 360deg

        );

      transition:
        transform 5.2s cubic-bezier(.12,.72,.12,1);

      transform-origin: center center;

      --wheel-rotation: 0deg;
    }


    /* خطوط القطاعات */

    .wheel-lines {

      position: absolute;

      inset: 0;

      border-radius: 50%;

      pointer-events: none;

      background:
        conic-gradient(

          transparent 0deg 50.9deg,
          rgba(0,0,0,.5) 50.9deg 51.45deg,

          transparent 51.45deg 102.3deg,
          rgba(0,0,0,.5) 102.3deg 102.86deg,

          transparent 102.86deg 153.73deg,
          rgba(0,0,0,.5) 153.73deg 154.29deg,

          transparent 154.29deg 205.16deg,
          rgba(0,0,0,.5) 205.16deg 205.72deg,

          transparent 205.72deg 256.58deg,
          rgba(0,0,0,.5) 256.58deg 257.14deg,

          transparent 257.14deg 308.01deg,
          rgba(0,0,0,.5) 308.01deg 308.57deg,

          transparent 308.57deg 359.44deg,
          rgba(0,0,0,.5) 359.44deg 360deg
        );
    }


    /* ================= LABELS ================= */

    /*
      كل كلمة موجودة على القطاع الصحيح،
      لكن يتم تعويض دورانها تلقائيًا
      حتى تبقى مستقيمة أثناء دوران العجلة.
    */

    .wheel-label {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 100px;

      text-align: center;

      transform-origin: 0 0;

      font-size: 16px;
      font-weight: 800;

      z-index: 3;

      transform:
        rotate(var(--angle))
        translateX(112px);
    }

    .wheel-label span {

      display: block;

      white-space: nowrap;

      transform:
        translate(-50%, -50%)
        rotate(
          calc(
            -1 * var(--angle)
            - var(--wheel-rotation)
          )
        );
    }

    .dark-label {
      color: white;
    }

    .light-label {
      color: #111;
    }


    /* ================= CENTER LOGO ================= */

    .wheel-logo {

      position: absolute;

      width: 82px;
      height: 82px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: white;

      border: 3px solid #111;

      object-fit: contain;

      padding: 12px;

      z-index: 20;

      /*
        الشعار منفصل عن عنصر العجلة،
        لذلك لا يدور معها.
      */
    }


    /* ================= POINTER ================= */

    .pointer {

      position: absolute;

      top: -18px;

      left: 50%;

      transform:
        translateX(-50%);

      width: 0;
      height: 0;

      border-left: 16px solid transparent;
      border-right: 16px solid transparent;

      border-top: 29px solid white;

      z-index: 30;
    }


    /* ================= BUTTON ================= */

    .spin-btn {

      margin-top: 38px;

      width: 220px;

      height: 55px;

      background: white;
      color: #111;

      border: none;

      font-size: 14px;
      font-weight: 800;

      transition: .2s;
    }

    .spin-btn:active {
      transform: scale(.98);
    }

    .spin-btn:disabled {

      opacity: .45;

      cursor: not-allowed;
    }


    .wheel-status {

      min-height: 22px;

      margin-top: 18px;

      color: #aaa;

      font-size: 12px;
    }


    /* ================= RESULT ================= */

    .result-box {

      display: none;

      width: min(500px, 92vw);

      margin-top: 30px;

      background: white;

      color: #111;

      padding: 28px 22px;
    }

    .result-title {

      color: #777;

      font-size: 13px;

      margin-bottom: 8px;
    }

    .result-prize {

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 20px;
    }

    .coupon {

      direction: ltr;

      font-family: monospace;

      font-size: 21px;

      letter-spacing: 2px;

      border: 1px dashed #111;

      padding: 14px;

      background: #fafafa;
    }

    .next-date {

      color: #777;

      font-size: 11px;

      margin-top: 14px;
    }


    /* ================= ADMIN ================= */

    #adminPanel {

      display: none;

      background: #f5f5f3;

      color: #111;

      width: 100%;

      padding: 40px 20px;
    }

    .admin-box {

      width: 100%;
      max-width: 1200px;

      margin: auto;

      background: white;

      padding: 25px;

      overflow-x: auto;
    }

    .admin-title {

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 20px;
    }

    table {

      width: 100%;

      border-collapse: collapse;

      min-width: 850px;

      font-size: 12px;
    }

    th,
    td {

      padding: 12px;

      border-bottom: 1px solid #eee;

      text-align: right;
    }

    th {

      background: #111;

      color: white;
    }


    /* ================= TOAST ================= */

    .toast {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(100px);

      background: #111;

      color: white;

      padding: 13px 20px;

      font-size: 12px;

      z-index: 999;

      opacity: 0;

      transition: .3s;

      max-width: 90%;

      text-align: center;
    }

    .toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      header {

        height: 68px;

        padding: 0 18px;
      }

      .header-logo {

        width: 95px;
        height: 50px;
      }

      .user-name {

        display: none;
      }

      .wheel-section {

        min-height: calc(100vh - 68px);

        padding-top: 45px;
      }

        font-size: 27px;
      }

      .wheel-subtitle {

        margin-bottom: 30px;
      }

        width: 315px;
        height: 315px;
      }

        width: 85px;

        font-size: 13px;

        transform:
          rotate(var(--angle))
          translateX(95px);
      }

      .wheel-logo {

        width: 70px;
        height: 70px;

        padding: 10px;
      }

      .spin-btn {

        width: 205px;

        height: 52px;
      }
    }

  </style>
</head>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vknhrxxkmhrnfbmsllid.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_QliqBYSeykn4F2Ddrsn8hg_F_N8dR-n";


const { createClient } =
  supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   ADMIN
===================================================== */

const ADMIN_UID =
  "2d2313ef-8ae1-40a0-9a56-89abe56d3c37";



/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
  document.getElementById("loginScreen");


const store =
  document.getElementById("store");


const googleBtn =
  document.getElementById("googleBtn");


const logoutBtn =
  document.getElementById("logoutBtn");


const userName =
  document.getElementById("userName");


const spinBtn =
  document.getElementById("spinBtn");


const wheel =
  document.getElementById("wheel");


const wheelStatus =
  document.getElementById("wheelStatus");


const resultBox =
  document.getElementById("resultBox");


const resultPrize =
  document.getElementById("resultPrize");


const couponCode =
  document.getElementById("couponCode");


const nextDate =
  document.getElementById("nextDate");


const adminPanel =
  document.getElementById("adminPanel");


const participantsBody =
  document.getElementById("participantsBody");


const toast =
  document.getElementById("toast");



/* =====================================================
   GOOGLE LOGIN
===================================================== */

googleBtn.addEventListener(
  "click",
  async () => {

    googleBtn.disabled = true;

    googleBtn.innerHTML =
      "جاري فتح Google...";


    try {

      const redirectUrl =
        window.location.origin +
        window.location.pathname;


      const { error } =
        await db.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo: redirectUrl,

            queryParams: {

              prompt: "select_account"

            }

          }

        });


      if (error) {
        throw error;
      }


    } catch (error) {

      console.error(error);

      showToast(
        "حدث خطأ أثناء تسجيل الدخول باستخدام Google"
      );


      googleBtn.disabled = false;


      googleBtn.innerHTML =
        '<span class="google-icon">G</span> متابعة باستخدام Google';

    }

  }
);



/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    await db.auth.signOut();

    location.reload();

  }
);



/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  toast.textContent =
    message;

  toast.classList.add("show");


  setTimeout(() => {

    toast.classList.remove("show");

  }, 3500);

}



/* =====================================================
   DATE
===================================================== */

function formatDate(dateString) {

  if (!dateString) {
    return "-";
  }


  return new Date(dateString)
    .toLocaleString(
      "ar-IQ",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

}



/* =====================================================
   REMAINING TIME
===================================================== */

function formatRemaining(date) {

  const difference =
    date.getTime() -
    Date.now();


  if (difference <= 0) {
    return "الآن";
  }


  const days =
    Math.floor(
      difference /
      86400000
    );


  const hours =
    Math.floor(
      (
        difference %
        86400000
      ) /
      3600000
    );


  if (days > 0) {

    return (
      days +
      " يوم" +
      (
        hours
          ? " و " +
            hours +
            " ساعة"
          : ""
      )
    );

  }


  return hours +
    " ساعة";

}



/* =====================================================
   SHOW USER
===================================================== */

async function showUser(session) {

  if (
    !session ||
    !session.user
  ) {

    loginScreen.style.display =
      "flex";

    store.style.display =
      "none";

    return;

  }


  loginScreen.style.display =
    "none";

  store.style.display =
    "block";


  logoutBtn.style.display =
    "block";


  const user =
    session.user;


  const name =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "زائر HUMO";


  userName.textContent =
    name;


  await loadLastSpin();


  if (
    user.id === ADMIN_UID
  ) {

    adminPanel.style.display =
      "block";

    await loadParticipants();

  }

}



/* =====================================================
   LOAD LAST SPIN
===================================================== */

async function loadLastSpin() {

  try {

    const {
      data,
      error
    } = await db
      .from("spins")
      .select("*")
      .order(
        "spun_at",
        {
          ascending: false
        }
      )
      .limit(1);


    if (error) {

      console.error(error);

      return;

    }


    if (
      !data ||
      !data.length
    ) {

      spinBtn.disabled =
        false;

      wheelStatus.textContent =
        "لديك فرصة للمشاركة.";

      return;

    }


    const last =
      data[0];


    const next =
      new Date(
        last.next_eligible_at
      );


    if (
      next > new Date()
    ) {

      spinBtn.disabled =
        true;

      wheelStatus.textContent =
        "يمكنك المشاركة مرة أخرى بعد " +
        formatRemaining(next);

    } else {

      spinBtn.disabled =
        false;

      wheelStatus.textContent =
        "فرصتك متاحة الآن.";

    }


  } catch (error) {

    console.error(error);

  }

}



/* =====================================================
   SPIN
===================================================== */

spinBtn.addEventListener(
  "click",
  spinWheel
);



async function spinWheel() {

  if (spinBtn.disabled) {
    return;
  }


  spinBtn.disabled =
    true;


  wheelStatus.textContent =
    "جاري اختيار جائزتك...";


  resultBox.style.display =
    "none";


  try {

    const {
      data: {
        session
      }
    } =
      await db.auth.getSession();


    if (!session) {

      showToast(
        "يجب تسجيل الدخول أولاً."
      );

      spinBtn.disabled =
        false;

      return;

    }


    const {
      data,
      error
    } =
      await db.rpc(
        "spin_wheel"
      );


    if (error) {
      throw error;
    }


    const spin =
      Array.isArray(data)
        ? data[0]
        : data;


    if (!spin) {

      throw new Error(
        "لم يتم استلام نتيجة."
      );

    }


    const prize =
      spin.prize || "";


    const discount =
      Number(
        spin.discount_percent || 0
      );


    const coupon =
      spin.coupon_code || "";


    /*
      الترتيب البصري:

      0 = 5%
      1 = حظ أوفر
      2 = 10%
      3 = 15%
      4 = 20%
      5 = 25%
      6 = 30%
    */


    let targetIndex =
      0;


    if (
      discount === 0 ||
      prize.includes("حظ")
    ) {

      targetIndex =
        1;

    } else {

      const map = {

        5: 0,

        10: 2,

        15: 3,

        20: 4,

        25: 5,

        30: 6

      };


      targetIndex =
        map[discount] ??
        0;

    }


    const segment =
      360 / 7;


    const targetCenter =
      targetIndex *
      segment +
      segment / 2;


    /*
      المؤشر في الأعلى.
      الدوران النهائي يضع
      القطاع الفائز عند المؤشر.
    */

    const finalRotation =
      360 * 7 +
      (360 - targetCenter);


    /*
      هذا المتغير يعالج مشكلة
      النصوص المقلوبة.

      العجلة تدور،
      لكن النص يبقى مستقيمًا.
    */

    wheel.style.setProperty(
      "--wheel-rotation",
      finalRotation + "deg"
    );


    wheel.style.transform =
      "rotate(" +
      finalRotation +
      "deg)";


    setTimeout(() => {

      resultPrize.textContent =
        prize;


      couponCode.textContent =
        coupon;


      nextDate.textContent =
        "يمكنك المشاركة مرة أخرى في: " +
        formatDate(
          spin.next_eligible_at
        );


      resultBox.style.display =
        "block";


      wheelStatus.textContent =
        "مبروك 🎉";


    }, 5350);


  } catch (error) {

    console.error(error);


    spinBtn.disabled =
      false;


    let message =
      error?.message ||
      "حدث خطأ.";


    if (
      message.includes("14")
    ) {

      message =
        "لقد شاركت مسبقًا. يمكنك المشاركة مرة أخرى بعد 14 يومًا.";

    }


    showToast(message);


    wheelStatus.textContent =
      "";

  }

}



/* =====================================================
   ADMIN
===================================================== */

async function loadParticipants() {

  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "get_participants"
      );


    if (error) {
      throw error;
    }


    participantsBody.innerHTML =
      "";


    if (
      !data ||
      !data.length
    ) {

      participantsBody.innerHTML =
        "<tr><td colspan='7'>لا توجد مشاركات بعد.</td></tr>";

      return;

    }


    data.forEach(
      user => {

        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${escapeHtml(
              user.full_name || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.phone || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.email || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              user.prize || "-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHtml(
              user.coupon_code || "-"
            )}
          </td>

          <td>
            ${formatDate(
              user.last_spin_at
            )}
          </td>

          <td>
            ${formatDate(
              user.next_eligible_at
            )}
          </td>

        `;


        participantsBody.appendChild(
          row
        );

      }
    );


  } catch (error) {

    console.error(error);

    participantsBody.innerHTML =
      "<tr><td colspan='7'>تعذر تحميل المشاركين.</td></tr>";

  }

}



/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =====================================================
   AUTH STATE
===================================================== */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event ===
        "SIGNED_IN" ||

      event ===
        "INITIAL_SESSION"
    ) {

      await showUser(
        session
      );

    }


    if (
      event ===
      "SIGNED_OUT"
    ) {

      loginScreen.style.display =
        "flex";

      store.style.display =
        "none";

    }

  }
);



/* =====================================================
   START
===================================================== */

async function start() {

  const {
    data: {
      session
    }
  } =
    await db.auth.getSession();


  await showUser(
    session
  );

}


start();

</script>
