<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HUMO — خصومات الخميس</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      height: 72px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .header-logo {
      width: 105px;
      height: 48px;
      object-fit: contain;
      object-position: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
    }

    .user-email {
      font-size: 12px;
      color: #666;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginView {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border: 1px solid #e9e9e9;
      border-radius: 18px;
      padding: 32px 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .login-logo {
      width: 150px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .login-card h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .login-subtitle {
      margin: 9px 0 25px;
      color: #777;
      font-size: 14px;
    }

    .google-btn {
      width: 100%;
      height: 46px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin-bottom: 17px;
    }

    .google-btn:hover {
      background: #fafafa;
    }

    .google-icon {
      font-weight: bold;
      font-size: 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aaa;
      font-size: 12px;
      margin: 17px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e7e7e7;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .login-form input {
      width: 100%;
      height: 46px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 14px;
      outline: none;
      direction: rtl;
    }

    .login-form input:focus {
      border-color: #111;
    }

    .main-login-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .main-login-btn:hover {
      background: #292929;
    }

    .login-links {
      margin-top: 17px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .text-btn {
      border: none;
      background: transparent;
      color: #555;
      font-size: 12px;
      padding: 0;
      text-decoration: underline;
    }

    .text-btn:hover {
      color: #000;
    }

    #loginMessage {
      min-height: 20px;
      margin-top: 13px;
      font-size: 12px;
      color: #777;
      line-height: 1.6;
    }

    /* =========================
       MAIN
    ========================= */

    #appView {
      display: none;
      min-height: calc(100vh - 72px);
      padding: 30px 15px 55px;
    }

    .wheel-section {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .wheel-title {
      margin: 2px 0 7px;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .wheel-subtitle {
      margin: 0 0 20px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       WHEEL
    ========================= */

    .wheel-wrap {
      width: min(92vw, 470px);
      aspect-ratio: 1;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 25px solid #111;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,.18));
    }

    #wheel {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 5.2s cubic-bezier(.13,.72,.16,1);
      transform-origin: 50% 50%;
      cursor: pointer;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.13));
    }

    #wheel.disabled {
      cursor: not-allowed;
      opacity: .76;
    }

    .wheel-center {
      position: absolute;
      width: 90px;
      height: 90px;
      background: #fff;
      border: 4px solid #111;
      border-radius: 50%;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      pointer-events: none;
    }

    .wheel-center img {
      width: 68px;
      height: 58px;
      object-fit: contain;
    }

    /* =========================
       COUNTDOWN
    ========================= */

    .countdown-title {
      margin-top: 17px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #777;
      font-weight: 600;
    }

    .countdown-box {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      background: linear-gradient(#343434, #1c1c1c);
      border-radius: 13px;
      padding: 10px 13px 9px;
      box-shadow:
        0 6px 15px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.08);
      direction: ltr;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .time-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 45px;
    }

    .digits {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .digit {
      width: 21px;
      height: 30px;
      border-radius: 4px;
      border: 1px solid #080808;
      background:
        linear-gradient(
          to bottom,
          #505050 0%,
          #2b2b2b 46%,
          #151515 50%,
          #303030 54%,
          #4a4a4a 100%
        );
      color: #f5f5f5;
      font-size: 22px;
      line-height: 28px;
      font-weight: 700;
      text-align: center;
      font-family: Arial, sans-serif;
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.16),
        0 1px 2px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
    }

    .digit::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255,255,255,.32);
      box-shadow: 0 -1px 0 rgba(0,0,0,.45);
    }

    .time-label {
      color: #f3f3f3;
      font-size: 8px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: .4px;
    }

    .colon {
      color: #f1f1f1;
      font-size: 20px;
      font-weight: 700;
      margin-top: -14px;
    }

    .countdown-status {
      margin-top: 8px;
      color: #777;
      font-size: 11px;
      min-height: 16px;
    }

    /* =========================
       SPIN BUTTON
    ========================= */

    .spin-btn {
      margin-top: 17px;
      width: min(260px, 88vw);
      height: 48px;
      border: none;
      border-radius: 11px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .spin-btn:hover:not(:disabled) {
      background: #292929;
      transform: translateY(-1px);
    }

    .spin-btn:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }

    /* =========================
       RESULT
    ========================= */

    .result-box {
      margin: 18px auto 0;
      max-width: 380px;
      min-height: 0;
      display: none;
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.05);
    }

    .result-prize {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .result-code {
      font-size: 13px;
      color: #555;
    }

    .result-code strong {
      color: #111;
      letter-spacing: 1px;
    }

    .result-note {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminPanel {
      display: none;
      width: 100%;
      max-width: 1050px;
      margin: 45px auto 0;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.05);
    }

    .admin-header {
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .admin-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .refresh-admin {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
    }

    .admin-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      direction: rtl;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: right;
      font-size: 12px;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-weight: 800;
    }

    td {
      color: #555;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      header {
        height: 62px;
        padding: 0 15px;
      }

      .header-logo {
        width: 90px;
        height: 42px;
      }

      .user-email {
        max-width: 120px;
        font-size: 10px;
      }

      .logout-btn {
        padding: 7px 10px;
        font-size: 10px;
      }

      #appView {
        min-height: calc(100vh - 62px);
        padding-top: 24px;
      }

      .wheel-title {
        font-size: 27px;
      }

      .wheel-subtitle {
        margin-bottom: 17px;
      }

      .wheel-wrap {
        width: min(92vw, 410px);
      }

      .wheel-center {
        width: 78px;
        height: 78px;
      }

      .wheel-center img {
        width: 59px;
        height: 51px;
      }

      .countdown-box {
        padding: 9px 10px 8px;
      }

      .time-group {
        min-width: 40px;
      }

      .digit {
        width: 19px;
        height: 28px;
        font-size: 20px;
        line-height: 26px;
      }

      .colon {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header id="siteHeader" style="display:none;">
    <img
      class="header-logo"
      id="headerLogo"
      alt="HUMO"
    />

    <div class="header-left">

  <!-- =========================
       LOGIN VIEW
  ========================= -->

  <section id="loginView">

    <div class="login-card">

      <img

        alt="HUMO"

          <div class="time-group">
            <div class="digits">

            </div>

          <div class="colon">:</div>

          <div class="time-group">

  <script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://vknhrxxkmhrnfbmsllid.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QliqBYSeykn4F2Ddrsn8hg_F_N8dR-n";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================================================
       LOGO
    ========================================================= */

    const logoFile =
      "./كيس%20ورقي%20للمتاجر%20بلون%20وردي%20نمط%20زهور.png";

    document.getElementById("headerLogo").src = logoFile;
    document.getElementById("loginLogo").src = logoFile;

    /* =========================================================

    ========================================================= */

    const loginView =

    const appView =
      document.getElementById("appView");

    const siteHeader =
      document.getElementById("siteHeader");

    const userEmail =
      document.getElementById("userEmail");

    const loginMessage =
      document.getElementById("loginMessage");

    const googleBtn =
      document.getElementById("googleBtn");

    const emailForm =
      document.getElementById("emailForm");

    const emailInput =

    const passwordInput =
      document.getElementById("passwordInput");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const forgotBtn =
      document.getElementById("forgotBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const wheel =
      document.getElementById("wheel");

    const spinBtn =
      document.getElementById("spinBtn");

    const resultBox =
      document.getElementById("resultBox");

    const resultPrize =
      document.getElementById("resultPrize");

    const resultCode =
      document.getElementById("resultCode");

    const countdownStatus =
      document.getElementById("countdownStatus");

    const adminPanel =
      document.getElementById("adminPanel");

    const adminTableBody =
      document.getElementById("adminTableBody");

    const refreshAdminBtn =
      document.getElementById("refreshAdminBtn");


    /* =========================================================
       PRIZES
       VISUAL WHEEL ONLY
       REAL PROBABILITIES ARE SERVER-SIDE
    ========================================================= */

    const prizes = [
      {
        label: "خصم 5%",
        color: "#111111",
        text: "#ffffff"
      },
      {
        label: "حظ أوفر",
        color: "#ffffff",
        text: "#111111"
      },
      {
        label: "خصم 10%",
        color: "#3A3A3A",
        text: "#ffffff"
      },
      {
        label: "خصم 15%",
        color: "#ffffff",
        text: "#111111"
      },
      {
        label: "خصم 20%",
        color: "#111111",
        text: "#ffffff"
      },
      {
        label: "خصم 25%",
        color: "#3A3A3A",
        text: "#ffffff"
      },
      {
        label: "خصم 30%",
        color: "#ffffff",
        text: "#111111"
      }
    ];


    /* =========================================================
       SVG WHEEL
    ========================================================= */

    function polarToCartesian(
      cx,
      cy,
      radius,
      angle
    ) {
      const radians =
        (angle - 90) * Math.PI / 180;

      return {
        x: cx + radius * Math.cos(radians),
        y: cy + radius * Math.sin(radians)
      };
    }


    function describeArc(
      cx,
      cy,
      radius,
      startAngle,
      endAngle
    ) {

      const start =
        polarToCartesian(
          cx,
          cy,
          radius,
          endAngle
        );

      const end =
        polarToCartesian(
          cx,
          cy,
          radius,
          startAngle
        );

      const largeArcFlag =
        endAngle - startAngle <= 180
          ? "0"
          : "1";

      return [
        "M",
        cx,
        cy,
        "L",
        start.x,
        start.y,
        "A",
        radius,
        radius,
        0,
        largeArcFlag,
        0,
        end.x,
        end.y,
        "Z"
      ].join(" ");
    }


    function createWheel() {

      wheel.innerHTML = "";

      const cx = 250;
      const cy = 250;
      const radius = 238;

      const sectorAngle =
        360 / prizes.length;

      prizes.forEach((prize, index) => {

        const startAngle =
          index * sectorAngle;

        const endAngle =
          (index + 1) * sectorAngle;

        /* Sector */

        const path =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );

        path.setAttribute(
          "d",
          describeArc(
            cx,
            cy,
            radius,
            startAngle,
            endAngle
          )
        );

        path.setAttribute(
          "fill",
          prize.color
        );

        path.setAttribute(
          "stroke",
          "#ffffff"
        );

        path.setAttribute(
          "stroke-width",
          "3"
        );

        wheel.appendChild(path);


        /* Text */

        const textAngle =
          startAngle + sectorAngle / 2;

        const textRadius = 158;

        const textPosition =
          polarToCartesian(
            cx,
            cy,
            textRadius,
            textAngle
          );

        const text =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );

        text.setAttribute(
          "x",
          textPosition.x
        );

        text.setAttribute(
          "y",
          textPosition.y
        );

        text.setAttribute(
          "fill",
          prize.text
        );

        text.setAttribute(
          "font-size",
          "19"
        );

        text.setAttribute(
          "font-weight",
          "700"
        );

        text.setAttribute(
          "text-anchor",
          "middle"
        );

        text.setAttribute(
          "dominant-baseline",
          "middle"
        );

        text.setAttribute(
          "font-family",
          "Arial, Noto Sans Arabic, sans-serif"
        );

        text.setAttribute(
          "transform",
          `rotate(${textAngle}, ${textPosition.x}, ${textPosition.y})`
        );

        text.textContent =
          prize.label;

        wheel.appendChild(text);

      });


      /* Outer circle */

      const outer =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      outer.setAttribute("cx", cx);
      outer.setAttribute("cy", cy);
      outer.setAttribute("r", radius);
      outer.setAttribute("fill", "none");
      outer.setAttribute("stroke", "#111");
      outer.setAttribute("stroke-width", "5");

      wheel.appendChild(outer);


      /* Inner circle */

      const inner =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      inner.setAttribute("cx", cx);
      inner.setAttribute("cy", cy);
      inner.setAttribute("r", "46");
      inner.setAttribute("fill", "#fff");
      inner.setAttribute("stroke", "#111");
      inner.setAttribute("stroke-width", "3");

      wheel.appendChild(inner);

    }

    createWheel();


    /* =========================================================
       COUNTDOWN
    ========================================================= */

    let countdownInterval = null;
    let nextEligibleAt = null;
    let currentlySpinning = false;


    function setCountdownDigits(
      days,
      hours,
      minutes,
      seconds
    ) {

      const values = [
        [days, "days1", "days2"],
        [hours, "hours1", "hours2"],
        [minutes, "mins1", "mins2"],
        [seconds, "secs1", "secs2"]
      ];

      values.forEach(
        ([value, firstId, secondId]) => {

          const text =
            String(value).padStart(2, "0");

          document.getElementById(firstId)
            .textContent = text[0];

          document.getElementById(secondId)
            .textContent = text[1];

        }
      );
    }


    function showAvailableCountdown() {

      setCountdownDigits(
        0,
        0,
        0,
        0
      );

      countdownStatus.textContent =
        "متاح الآن";

      spinBtn.disabled =
        currentlySpinning;

      wheel.classList.toggle(
        "disabled",
        currentlySpinning
      );
    }


    function updateCountdown() {

      /*
        هذا الجزء مهم:
        العداد ظاهر دائمًا للمستخدم الجديد والقديم.
      */

      if (!nextEligibleAt) {

        showAvailableCountdown();

        return;
      }


      const target =
        new Date(nextEligibleAt).getTime();

      const now =
        Date.now();

      let difference =
        target - now;


      if (difference <= 0) {

        nextEligibleAt = null;

        showAvailableCountdown();

        return;
      }


      const totalSeconds =
        Math.floor(
          difference / 1000
        );

      const days =
        Math.floor(
          totalSeconds / 86400
        );

      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      setCountdownDigits(
        days,
        hours,
        minutes,
        seconds
      );


      countdownStatus.textContent =
        "المحاولة القادمة متاحة بعد انتهاء العداد";


      spinBtn.disabled =
        true;

      wheel.classList.add(
        "disabled"
      );

    }


    function startCountdown() {

      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      updateCountdown();

      countdownInterval =
        setInterval(
          updateCountdown,
          1000
        );
    }


    /* =========================================================
       LOAD USER'S LATEST SPIN
    ========================================================= */

    async function loadLatestSpin() {

      nextEligibleAt = null;

      /*
        في البداية يظهر العداد للجميع
        حتى لو كان المستخدم جديدًا.
      */

      showAvailableCountdown();

      const {
        data,
        error
      } = await db
        .from("spins")
        .select(
          "spun_at, prize, discount_percent, coupon_code, next_eligible_at"
        )
        .order(
          "spun_at",
          {
            ascending: false
          }
        )
        .limit(1);

      if (error) {

        console.error(
          "loadLatestSpin:",
          error
        );

        startCountdown();

        return;
      }


      if (data && data.length > 0) {

        const latest =
          data[0];

        nextEligibleAt =
          latest.next_eligible_at;

      }

      startCountdown();
    }


    /* =========================================================
       GOOGLE LOGIN
    ========================================================= */

    googleBtn.addEventListener(
      "click",
      async () => {

        loginMessage.textContent =
          "جاري فتح Google...";

        const {
          error
        } = await db.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo:
              window.location.origin +
              window.location.pathname,

            queryParams: {
              prompt: "select_account"
            }
          }
        });

        if (error) {

          loginMessage.textContent =
            error.message;

        }

      }
    );


    /* =========================================================
       EMAIL LOGIN
    ========================================================= */

    emailForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {
          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "جاري الدخول...";

        loginMessage.textContent =
          "";


        const {
          error
        } = await db.auth.signInWithPassword({
          email,
          password
        });


        loginBtn.disabled = false;

        loginBtn.textContent =
          "تسجيل الدخول";


        if (error) {

          loginMessage.textContent =
            "تعذر تسجيل الدخول: " +
            error.message;

          return;
        }

        loginMessage.textContent =
          "";

      }
    );


    /* =========================================================
       SIGN UP
    ========================================================= */

    signupBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          loginMessage.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور أولاً.";

          return;
        }


        if (password.length < 6) {

          loginMessage.textContent =
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

          return;
        }


        signupBtn.disabled = true;

        loginMessage.textContent =
          "جاري إنشاء الحساب...";


        const {
          data,
          error
        } = await db.auth.signUp({
          email,
          password
        });


        signupBtn.disabled = false;


        if (error) {

          loginMessage.textContent =
            "تعذر إنشاء الحساب: " +
            error.message;

          return;
        }


        if (
          data.user &&
          !data.session
        ) {

          loginMessage.textContent =
            "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.";

        } else {

          loginMessage.textContent =
            "تم إنشاء الحساب بنجاح.";

        }

      }
    );


    /* =========================================================
       FORGOT PASSWORD
    ========================================================= */

    forgotBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          loginMessage.textContent =
            "اكتب بريدك الإلكتروني أولاً.";

          return;
        }


        forgotBtn.disabled = true;

        loginMessage.textContent =
          "جاري إرسال رابط الاستعادة...";


        const {
          error
        } = await db.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              window.location.pathname
          }
        );


        forgotBtn.disabled = false;


        if (error) {

          loginMessage.textContent =
            error.message;

          return;
        }


        loginMessage.textContent =
          "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.";
      }
    );


    /* =========================================================
       LOGOUT
    ========================================================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await db.auth.signOut();

      }
    );


    /* =========================================================
       SPIN WHEEL
    ========================================================= */

    async function spinWheel() {

      if (currentlySpinning) {
        return;
      }


      if (nextEligibleAt) {

        const remaining =
          new Date(nextEligibleAt).getTime() -
          Date.now();

        if (remaining > 0) {

          updateCountdown();

          return;
        }

      }


      currentlySpinning = true;

      spinBtn.disabled = true;

      wheel.classList.add(
        "disabled"
      );

      spinBtn.textContent =
        "جاري الدوران...";

      resultBox.style.display =
        "none";


      /*
        نطلب النتيجة الحقيقية من Supabase.
        الاحتمالات لا تعتمد على شكل العجلة.
      */

      const {
        data,
        error
      } = await db.rpc(
        "spin_wheel"
      );


      if (error) {

        currentlySpinning = false;

        spinBtn.textContent =
          "جرّب حظك";

        await loadLatestSpin();

        alert(
          error.message ||
          "حدث خطأ، حاول مرة أخرى."
        );

        return;
      }


      const result =
        Array.isArray(data)
          ? data[0]
          : data;


      if (!result) {

        currentlySpinning = false;

        spinBtn.textContent =
          "جرّب حظك";

        await loadLatestSpin();

        return;
      }


      /*
        تحديد القطاع الفائز
      */

      const winningIndex =
        prizes.findIndex(
          prize =>
            prize.label === result.prize
        );


      let index =
        winningIndex >= 0
          ? winningIndex
          : 0;


      const sectorAngle =
        360 / prizes.length;


      /*
        مركز القطاع الفائز
        نريد وضعه تحت المؤشر الموجود بالأعلى.
      */

      const sectorCenter =
        index * sectorAngle +
        sectorAngle / 2;


      const targetRotation =
        360 * 7 +
        (360 - sectorCenter);


      wheel.style.transition =
        "transform 5.2s cubic-bezier(.13,.72,.16,1)";

      wheel.style.transform =
        `rotate(${targetRotation}deg)`;


      setTimeout(
        () => {

          resultPrize.textContent =
            result.prize;

          resultCode.textContent =
            result.coupon_code;

          resultBox.style.display =
            "block";


          nextEligibleAt =
            result.next_eligible_at;


          currentlySpinning =
            false;

          spinBtn.textContent =
            "جرّب حظك";


          startCountdown();

        },
        5400
      );

    }


    /* =========================================================
       CLICK WHEEL + BUTTON
    ========================================================= */

    spinBtn.addEventListener(
      "click",
      spinWheel
    );


    wheel.addEventListener(
      "click",
      spinWheel
    );


    /* =========================================================
       ADMIN
    ========================================================= */

    async function checkAdmin() {

      const {
        data,
        error
      } = await db
        .from("profiles")
        .select("is_admin")
        .single();


      if (error) {

        console.log(
          "Admin check:",
          error.message
        );

        return false;
      }


      return data &&
        data.is_admin === true;
    }


    async function loadAdminParticipants() {

      const {
        data,
        error
      } = await db.rpc(
        "get_participants"
      );


      if (error) {

        console.error(
          "get_participants:",
          error
        );

        return;
      }


      adminTableBody.innerHTML =
        "";


      (data || []).forEach(
        participant => {

          const row =
            document.createElement("tr");


          row.innerHTML = `
            <td>${escapeHtml(
              participant.email || "-"
            )}</td>

            <td>${escapeHtml(
              participant.full_name || "-"
            )}</td>

            <td>${escapeHtml(
              participant.phone || "-"
            )}</td>

            <td>${formatDate(
              participant.last_spin_at
            )}</td>

            <td>${escapeHtml(
              participant.prize || "-"
            )}</td>

            <td>${escapeHtml(
              participant.coupon_code || "-"
            )}</td>

            <td>${formatDate(
              participant.next_eligible_at
            )}</td>
          `;


          adminTableBody.appendChild(
            row
          );

        }
      );

    }


    refreshAdminBtn.addEventListener(
      "click",
      loadAdminParticipants
    );


    /* =========================================================
       SECURITY HELPERS
    ========================================================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function formatDate(value) {

      if (!value) {
        return "-";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }


      return date.toLocaleString(
        "ar-IQ",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =========================================================
       AUTH STATE
    ========================================================= */

    async function showApp(session) {

      if (!session) {

        siteHeader.style.display =
          "none";

        loginView.style.display =
          "flex";

        appView.style.display =
          "none";

        return;
      }


      siteHeader.style.display =
        "flex";

      loginView.style.display =
        "none";

      appView.style.display =
        "block";


      userEmail.textContent =
        session.user.email || "";


      /*
        مهم جدًا:
        عند كل دخول، سواء المستخدم جديد أو قديم،
        يتم تحميل العداد.
      */

      await loadLatestSpin();


      /*
        فحص الأدمن
      */

      const isAdmin =
        await checkAdmin();


      if (isAdmin) {

        adminPanel.style.display =
          "block";

        await loadAdminParticipants();

      } else {

        adminPanel.style.display =
          "none";

      }

    }


    /* =========================================================
       INITIAL SESSION
    ========================================================= */

    async function initialize() {

      const {
        data
      } = await db.auth.getSession();


      await showApp(
        data.session
      );

    }


    db.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        /*
          تأخير بسيط حتى يتم تحديث
          جلسة Supabase بالكامل.
        */

        setTimeout(
          () => {
            showApp(session);
          },
          50
        );

      }
    );


    initialize();

  </script>
